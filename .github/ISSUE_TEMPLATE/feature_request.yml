name: Feature Request
description: Propose a new input field, output field, or behavior change
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing server-side filtering, or a filter the registry's own bulk export doesn't
        support? Read this Actor's documented doctrine first (README → "What this actor
        deliberately does not do") — the registry's export has no query mechanism, so all
        filtering here is necessarily client-side, after download.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the real use case this would unblock, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What input field, output field, or behavior would you like to see added?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New input filter
        - New output field
        - New alerting channel
        - Delta-engine / classification logic change
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Can this already be achieved with existing inputs (e.g. years, sectorFilter, turnoverFilter, onlyMissingDisclosures)? If so, why isn't that sufficient?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this isn't already possible with an existing input field (see README → Input reference)
          required: true
        - label: If this proposes a new filter, I confirmed it can be derived from fields the registry's CSV actually publishes
          required: false
